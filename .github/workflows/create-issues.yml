name: Create Timaflu User Story Issues

on:
  push:

jobs:
  create-issues:
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Create user story issues
        uses: actions/github-script@v7
        with:
          script: |
            const issueTemplate = ({ number, title, comment, role, wish, outcome, criteria }) => ({
              title,
              body: [
                `**Issue ${String(number).padStart(2, '0')}**`,
                `**Comment:** ${comment}`,
                `**Als** ${role}`,
                `**wil ik** ${wish}`,
                `**zodat** ${outcome}.`,
                '',
                '## Acceptatiecriteria',
                ...criteria.map(item => `- ${item}`)
              ].join('\n')
            });

            const issues = [
              issueTemplate({
                number: 1,
                title: 'Klanten beheren',
                comment: 'Victor, Nadia',
                role: 'verkoopmedewerker',
                wish: 'klantgegevens centraal beheren',
                outcome: 'alle afdelingen dezelfde informatie gebruiken',
                criteria: ['Klant aanmaken', 'Klant wijzigen', 'Klant verwijderen', 'Leveradres registreren', 'Factuuradres registreren', 'Telefoonnummer registreren', 'Jaaromzet registreren']
              }),
              issueTemplate({
                number: 2,
                title: 'Orders registreren',
                comment: 'Janiek, Nadia',
                role: 'verkoopmedewerker',
                wish: 'telefonisch geplaatste orders digitaal registreren',
                outcome: 'orders correct verwerkt worden',
                criteria: ['Klant selecteren', 'Product toevoegen', 'Aantal invoeren', 'Orderdatum opslaan', 'Totaalprijs berekenen']
              }),
              issueTemplate({
                number: 3,
                title: 'Kortingen automatisch berekenen',
                comment: 'Victor, Nadia',
                role: 'verkoopmedewerker',
                wish: 'automatische kortingsberekeningen',
                outcome: 'fouten worden voorkomen',
                criteria: ['5% korting vanaf €500', 'Klantkorting automatisch toepassen', 'Jaaromzet automatisch bepalen']
              }),
              issueTemplate({
                number: 4,
                title: 'Realtime voorraadbeheer',
                comment: 'Floris Melchers, Lars',
                role: 'verkoopmedewerker',
                wish: 'actuele voorraad kunnen zien',
                outcome: 'ik geen niet-beschikbare medicijnen verkoop',
                criteria: ['Voorraad realtime zichtbaar', 'Gereserveerde voorraad zichtbaar', 'Niet beschikbare producten markeren']
              }),
              issueTemplate({
                number: 5,
                title: 'Orderstatus beheren',
                comment: 'Floris Goudswaard, Janiek',
                role: 'medewerker',
                wish: 'de status van orders volgen',
                outcome: 'klanten geïnformeerd kunnen worden',
                criteria: ['Nieuw', 'Wordt verzameld', 'Backorder', 'Verpakt', 'Verzonden', 'Afgeleverd']
              }),
              issueTemplate({
                number: 6,
                title: 'Productcatalogus beheren',
                comment: 'Lars, Floris Melchers',
                role: 'inkoper',
                wish: 'producten centraal beheren',
                outcome: 'de catalogus actueel blijft',
                criteria: ['Product toevoegen', 'Product wijzigen', 'Product verwijderen', 'Productgegevens beheren']
              }),
              issueTemplate({
                number: 7,
                title: 'Fabrikanten beheren',
                comment: 'Lars, Floris Melchers',
                role: 'inkoper',
                wish: 'leveranciers beheren',
                outcome: 'producten gekoppeld zijn aan fabrikanten',
                criteria: ['Fabrikant toevoegen', 'Fabrikant wijzigen', 'Leverprijzen beheren']
              }),
              issueTemplate({
                number: 8,
                title: 'Minimumvoorraad bewaken',
                comment: 'Lars, Floris Melchers',
                role: 'inkoper',
                wish: 'waarschuwingen bij lage voorraad',
                outcome: 'tijdig besteld kan worden',
                criteria: ['Minimumvoorraad instellen', 'Meldingen genereren', 'Overzicht tekorten tonen']
              }),
              issueTemplate({
                number: 9,
                title: 'Robotorders aansturen',
                comment: 'Victor, Floris Melchers',
                role: 'systeem',
                wish: 'orders automatisch verdelen over robots',
                outcome: 'medicijnen automatisch verzameld worden',
                criteria: ['Deelorders genereren', 'Robot per gang aansturen', 'Gereedmelding ontvangen']
              }),
              issueTemplate({
                number: 10,
                title: 'Verzamelbakken registreren',
                comment: 'Victor, Janiek',
                role: 'magazijnsysteem',
                wish: 'verzamelbakken kunnen volgen',
                outcome: 'orders traceerbaar blijven',
                criteria: ['Unieke bakcode', 'Koppeling aan order', 'Locatie registreren']
              }),
              issueTemplate({
                number: 11,
                title: 'Levermoment plannen',
                comment: 'Floris Goudswaard, Janiek',
                role: 'klant',
                wish: 'een datum en dagdeel kiezen',
                outcome: 'ik aanwezig ben bij levering',
                criteria: ['Datum kiezen', 'Ochtend kiezen', 'Middag kiezen']
              }),
              issueTemplate({
                number: 12,
                title: 'Ritplanning bekijken',
                comment: 'Nadia, Floris Goudswaard',
                role: 'koerier',
                wish: 'mijn toegewezen ritten zien',
                outcome: 'ik efficiënt kan leveren',
                criteria: ['Regio zichtbaar', 'Spoedritten zichtbaar', 'Leveradres zichtbaar']
              }),
              issueTemplate({
                number: 13,
                title: 'Levering bevestigen',
                comment: 'Nadia, Floris Goudswaard',
                role: 'koerier',
                wish: 'leveringen kunnen afmelden',
                outcome: 'de orderstatus wordt bijgewerkt',
                criteria: ['Afgeleverd registreren', 'Datum opslaan', 'Tijdstip opslaan']
              }),
              issueTemplate({
                number: 14,
                title: 'Facturen genereren',
                comment: 'Lars, Nadia',
                role: 'administratie',
                wish: 'automatisch facturen genereren',
                outcome: 'klanten correct gefactureerd worden',
                criteria: ['Wekelijkse facturen', 'Alleen geleverde producten', 'Factuurbedrag berekenen']
              }),
              issueTemplate({
                number: 15,
                title: 'Betalingsherinneringen versturen',
                comment: 'Lars, Nadia',
                role: 'administratie',
                wish: 'herinneringen kunnen versturen',
                outcome: 'openstaande facturen betaald worden',
                criteria: ['Eerste herinnering', 'Tweede herinnering', 'Incassotraject starten']
              }),
              issueTemplate({
                number: 16,
                title: 'Nieuwe klanten werven',
                comment: 'Nadia, Victor',
                role: 'accountmanager',
                wish: 'prospects registreren',
                outcome: 'nieuwe klanten opgevolgd worden',
                criteria: ['Prospect registreren', 'Contactgegevens opslaan', 'Opvolgstatus registreren']
              }),
              issueTemplate({
                number: 17,
                title: 'Authenticatie en autorisatie',
                comment: 'Floris Melchers, Lars',
                role: 'systeembeheerder',
                wish: 'gebruikersrollen beheren',
                outcome: 'alleen bevoegde medewerkers toegang hebben tot functies',
                criteria: ['Rollen beheren', 'Autorisatie controleren', 'Toegang beperken per functie']
              }),
              issueTemplate({
                number: 18,
                title: 'Auditlog bijhouden',
                comment: 'Floris Goudswaard, Nadia',
                role: 'directie',
                wish: 'wijzigingen kunnen volgen',
                outcome: 'acties herleidbaar zijn',
                criteria: ['Orders loggen', 'Voorraadwijzigingen loggen', 'Gebruikers registreren']
              }),
              issueTemplate({
                number: 19,
                title: 'Dashboard voorraadtekorten',
                comment: 'Lars, Floris Melchers',
                role: 'inkoper',
                wish: 'producten onder minimumvoorraad zien',
                outcome: 'tijdig besteld kan worden',
                criteria: ['Productnaam tonen', 'Voorraad tonen', 'Minimumvoorraad tonen']
              }),
              issueTemplate({
                number: 20,
                title: 'Rapportage orderstatussen',
                comment: 'Victor, Nadia',
                role: 'directie',
                wish: 'orderstatusrapportages kunnen bekijken',
                outcome: 'prestaties gevolgd kunnen worden',
                criteria: ['Openstaande orders zichtbaar', 'Backorders zichtbaar', 'Afgeleverde orders zichtbaar']
              }),
              issueTemplate({
                number: 21,
                title: 'Voorraad reserveren bij bestelling',
                comment: 'Janiek, Nadia',
                role: 'verkoopmedewerker',
                wish: 'voorraad automatisch reserveren',
                outcome: 'producten niet dubbel verkocht kunnen worden',
                criteria: ['Voorraad reserveren', 'Gereserveerde voorraad zichtbaar', 'Dubbele verkoop voorkomen']
              }),
              issueTemplate({
                number: 22,
                title: 'Klant informeren over orderstatus',
                comment: 'Victor, Janiek',
                role: 'klant',
                wish: 'de actuele orderstatus kunnen bekijken',
                outcome: 'ik weet waar mijn bestelling zich bevindt',
                criteria: ['Status zichtbaar', 'Leverdatum zichtbaar', 'Backorderstatus zichtbaar']
              }),
              issueTemplate({
                number: 23,
                title: 'Verkooprapportages genereren',
                comment: 'Victor, Nadia',
                role: 'directie',
                wish: 'verkooprapportages kunnen bekijken',
                outcome: 'strategische beslissingen genomen kunnen worden',
                criteria: ['Omzet per klant', 'Omzet per periode', 'Best verkochte medicijnen']
              }),
              issueTemplate({
                number: 24,
                title: 'Use Case Diagram opstellen',
                comment: 'Janiek, Nadia',
                role: 'projectteam',
                wish: 'use case modellen opstellen',
                outcome: 'de functionele scope helder is',
                criteria: ['Alle actoren geïdentificeerd', 'Alle use cases uitgewerkt', 'Diagram toegevoegd aan documentatie']
              }),
              issueTemplate({
                number: 25,
                title: 'Activity Diagram orderproces',
                comment: 'Victor, Floris Melchers',
                role: 'projectteam',
                wish: 'activity diagrammen maken',
                outcome: 'het bedrijfsproces traceerbaar wordt beschreven',
                criteria: ['Orderproces gemodelleerd', 'Beslismomenten opgenomen', 'Diagram gevalideerd']
              }),
              issueTemplate({
                number: 26,
                title: 'Activity Diagram voorraadbeheer',
                comment: 'Lars, Floris Melchers',
                role: 'projectteam',
                wish: 'voorraadbeheer modelleren',
                outcome: 'tekorten en backorders helder zijn',
                criteria: ['Voorraadproces uitgewerkt', 'Tekortscenario opgenomen', 'Backorderproces opgenomen']
              }),
              issueTemplate({
                number: 27,
                title: 'Domeinmodel ontwerpen',
                comment: 'Floris Goudswaard, Victor',
                role: 'projectteam',
                wish: 'een domeinmodel opstellen',
                outcome: 'belangrijke entiteiten en relaties helder zijn',
                criteria: ['Klant aanwezig', 'Order aanwezig', 'Product aanwezig', 'Leverancier aanwezig']
              }),
              issueTemplate({
                number: 28,
                title: 'ERD ontwerpen',
                comment: 'Floris Melchers, Lars',
                role: 'projectteam',
                wish: 'het enhanced ERD opstellen',
                outcome: 'de database goed genormaliseerd is',
                criteria: ['Entiteiten gedefinieerd', 'Relaties gedefinieerd', 'Keys uitgewerkt']
              }),
              issueTemplate({
                number: 29,
                title: 'Databaseontwerp maken',
                comment: 'Floris Melchers, Lars',
                role: 'projectteam',
                wish: 'databaseontwerp opstellen',
                outcome: 'de backend en frontend op dezelfde structuur voortbouwen',
                criteria: ['Tabellen ontworpen', 'Relaties uitgewerkt', 'Normalisatie toegepast']
              }),
              issueTemplate({
                number: 30,
                title: 'Wireframes ontwerpen',
                comment: 'Floris Goudswaard, Janiek',
                role: 'projectteam',
                wish: 'schermontwerpen opstellen',
                outcome: 'de frontend goed aansluit op de processen',
                criteria: ['Loginpagina', 'Dashboard', 'Orderscherm', 'Voorraadscherm']
              }),
              issueTemplate({
                number: 31,
                title: 'Softwarearchitectuur definiëren',
                comment: 'Victor, Nadia',
                role: 'projectteam',
                wish: 'de softwarearchitectuur definiëren',
                outcome: 'de onderdelen van frontend, backend en database samenhangend zijn',
                criteria: ['Frontend beschreven', 'Backend beschreven', 'Database beschreven', 'Architectuurdiagram gemaakt']
              }),
              issueTemplate({
                number: 32,
                title: 'REST API specificatie opstellen',
                comment: 'Nadia, Victor',
                role: 'projectteam',
                wish: 'de API contracten vastleggen',
                outcome: 'de backend en frontend consistent werken',
                criteria: ['Endpoints beschreven', 'Requests beschreven', 'Responses beschreven']
              }),
              issueTemplate({
                number: 33,
                title: 'CI/CD Pipeline configureren',
                comment: 'Victor, Nadia',
                role: 'projectteam',
                wish: 'een pipeline opzetten',
                outcome: 'automatische validatie en deploys mogelijk zijn',
                criteria: ['Build pipeline actief', 'PR validatie actief', 'Workflow succesvol uitvoerbaar']
              }),
              issueTemplate({
                number: 34,
                title: 'Testplan opstellen',
                comment: 'Janiek, Floris Goudswaard',
                role: 'projectteam',
                wish: 'testen beschrijven',
                outcome: 'de oplossing gecontroleerd en betrouwbaar is',
                criteria: ['Unit tests beschreven', 'Integratietests beschreven', 'Acceptatietests beschreven']
              }),
              issueTemplate({
                number: 35,
                title: 'Product Backlog onderhouden',
                comment: 'Floris Goudswaard, Nadia',
                role: 'projectteam',
                wish: 'de backlog bijwerken',
                outcome: 'prioriteiten en werkstroom helder blijven',
                criteria: ['Stories geprioriteerd', 'Story points toegevoegd', 'Sprintplanning mogelijk']
              })
            ];

            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });

            for (const issue of issues) {
              const existingIssue = existingIssues.data.find(item => item.title === issue.title);

              if (existingIssue) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  title: issue.title,
                  body: issue.body
                });
                console.log(`Updated issue #${existingIssue.number}: ${issue.title}`);
              } else {
                const createdIssue = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issue.title,
                  body: issue.body
                });
                console.log(`Created issue #${createdIssue.data.number}: ${issue.title}`);
              }
            }
