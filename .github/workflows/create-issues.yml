name: Create Timaflu User Story Issues

on:
  push:

jobs:
  create-issues:
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Create user story issues
        uses: actions/github-script@v7
        with:
          script: |
            const issueTemplate = ({ number, title, comment, role, wish, outcome, criteria }) => ({
              title,
              body: [
                `**Issue ${String(number).padStart(2, '0')}**`,
                `**Comment:** ${comment}`,
                `**Als** ${role}`,
                `**wil ik** ${wish}`,
                `**zodat** ${outcome}.`,
                '',
                '## Acceptatiecriteria',
                ...criteria.map(item => `- ${item}`)
              ].join('\n')
            });

            const issues = [
              issueTemplate({
                number: 1,
                title: 'Database met queries',
                comment: 'Floris Melchers, Lars',
                role: 'projectteam',
                wish: 'een werkende MySQL-database met queries opstellen',
                outcome: 'de database de benodigde schermen ondersteunt',
                criteria: ['Werkende MySQL-database', 'Genormaliseerd ontwerp', 'Queries per scherm', 'Output per query vastgelegd']
              }),
              issueTemplate({
                number: 2,
                title: 'Backend - verkoopproces, kortingsberekening en klantgegevens',
                comment: 'Victor, Nadia',
                role: 'projectteam',
                wish: 'de verkooplogica in Python implementeren',
                outcome: 'bestellingen correct worden berekend en verwerkt',
                criteria: ['5% bestellingskorting vanaf €500', '10% korting eerste bestelling', 'Klantenkorting op basis van jaaromzet', 'Eindbedrag berekenen']
              }),
              issueTemplate({
                number: 3,
                title: 'Backend - inkoop, voorraadbeheer en facturatie',
                comment: 'Lars, Floris Melchers',
                role: 'projectteam',
                wish: 'de inkoop- en voorraadlogica implementeren',
                outcome: 'tekorten, leverancierskeuzes en facturen correct worden verwerkt',
                criteria: ['Product niet op voorraad', 'Leveranciers tonen', 'Goedkoopste leverancier bovenaan', 'Contactgegevens tonen', 'Leverancier verwijderen', 'Product verwijderen']
              }),
              issueTemplate({
                number: 4,
                title: 'Backend - acquisitie en nieuwe klantaanmaak',
                comment: 'Nadia, Victor',
                role: 'projectteam',
                wish: 'de acquisitieproceslogica implementeren',
                outcome: 'potentiële klanten goed kunnen worden geregistreerd en opgevolgd',
                criteria: ['Bezoek registreren', 'Overzicht van bedrijven zonder bestelling > 1 maand', '10% kortingsactie', 'Klantaccount aanmaken']
              }),
              issueTemplate({
                number: 5,
                title: 'Frontend - verkoop en inkoopprocessen',
                comment: 'Janiek, Nadia',
                role: 'projectteam',
                wish: 'een frontend bouwen voor verkoop en inkoop',
                outcome: 'de bedrijfsprocessen via een website kunnen worden uitgevoerd',
                criteria: ['HTML', 'CSS', 'Geen JS-frameworks', 'Alle relevante schermen voor verkoop en inkoop']
              }),
              issueTemplate({
                number: 6,
                title: 'Frontend - distributie, orderpicking en mobiele schermen',
                comment: 'Floris Goudswaard, Janiek',
                role: 'projectteam',
                wish: 'de schermen voor distributie en orderpicking bouwen',
                outcome: 'de magazijn- en distributietaken op mobiel en desktop werken',
                criteria: ['Orderpicking responsive', 'Distributie responsive', 'HTML en CSS']
              }),
              issueTemplate({
                number: 7,
                title: 'Activity diagrams',
                comment: 'Victor, Floris Melchers',
                role: 'projectteam',
                wish: 'activity diagrams maken voor de gewenste processen',
                outcome: 'de bedrijfsprocessen helder en traceerbaar worden vastgelegd',
                criteria: ['Verkoop', 'Inkoop', 'Orderpicking met robots', 'Distributie', 'Administratie en facturatie', 'Acquisitie']
              }),
              issueTemplate({
                number: 8,
                title: 'Use case diagrammen en use case beschrijvingen',
                comment: 'Janiek, Nadia',
                role: 'projectteam',
                wish: 'use case diagrammen en beschrijvingen opstellen',
                outcome: 'de functionaliteit van het informatiesysteem en de robot duidelijk wordt beschreven',
                criteria: ['1 use case diagram voor het informatiesysteem', '1 use case diagram voor de magazijnrobot', 'Beschrijvingen van alle primaire use cases']
              }),
              issueTemplate({
                number: 9,
                title: 'Enhanced Entity Relationship Diagram',
                comment: 'Floris Melchers, Lars',
                role: 'projectteam',
                wish: 'een uitgebreid EER-diagram ontwerpen',
                outcome: 'de database goed is genormaliseerd en alle relevante gegevens zijn vastgelegd',
                criteria: ['Klanten', 'Orders', 'Orderregels', 'Producten', 'Leveranciers', 'Facturen', 'Koeriers', 'Robots', 'Acquisitiebezoeken']
              }),
              issueTemplate({
                number: 10,
                title: 'Schermontwerpen',
                comment: 'Floris Goudswaard, Victor',
                role: 'projectteam',
                wish: 'schermen ontwerpen voor alle bedrijfsprocessen',
                outcome: 'de frontend op basis van duidelijke schermontwerpen kan worden ontwikkeld',
                criteria: ['Schermen voor verkoop', 'Schermen voor inkoop', 'Schermen voor orderpicking', 'Schermen voor distributie', 'Schermen voor administratie en acquisitie']
              }),
              issueTemplate({
                number: 11,
                title: 'Klassendiagram ter ondersteuning van de backend',
                comment: 'Lars, Nadia',
                role: 'projectteam',
                wish: 'een klassendiagram voor de backend opstellen',
                outcome: 'de backendstructuur duidelijk en consistent is',
                criteria: ['Classes', 'Attributen', 'Methoden', 'Relaties tussen classes']
              }),
              issueTemplate({
                number: 12,
                title: 'Sequence diagrammen',
                comment: 'Victor, Janiek',
                role: 'projectteam',
                wish: 'sequence diagrammen voor de kernscenario\'s maken',
                outcome: 'de interactie tussen objecten in de belangrijkste use cases duidelijk is',
                criteria: ['Klantenkorting berekenen', 'Product niet op voorraad', 'Klant heeft niet betaald', 'Klant niet thuis bij levering', 'Potentiële klant heeft nog niet besteld']
              }),
              issueTemplate({
                number: 13,
                title: 'Vergaderingen, notulen en conflictpreventie',
                comment: 'Floris Goudswaard, Nadia',
                role: 'projectteam',
                wish: 'vergaderingen en samenwerking op orde houden',
                outcome: 'de projectorganisatie, communicatie en samenwerking goed verlopen',
                criteria: ['Agenda', 'Notulen', 'Samenwerkingsafspraken', 'Herbeoordeling van afspraken']
              })
            ];

            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });

            for (const issue of issues) {
              const existingIssue = existingIssues.data.find(item => item.title === issue.title);

              if (existingIssue) {
                const currentCommentMatch = (existingIssue.body || '').match(/\*\*Comment:\*\*\s*(.*)/i);
                const preservedComment = currentCommentMatch ? currentCommentMatch[1].trim() : issue.comment;
                const updatedBody = issue.body.replace(/\*\*Comment:\*\*\s*.*(?:\r?\n|$)/i, `**Comment:** ${preservedComment}\n`);

                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  title: issue.title,
                  body: updatedBody
                });
                console.log(`Updated issue #${existingIssue.number}: ${issue.title}`);
              } else {
                const createdIssue = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issue.title,
                  body: issue.body
                });
                console.log(`Created issue #${createdIssue.data.number}: ${issue.title}`);
              }
            }
