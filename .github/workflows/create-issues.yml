            {
              title: 'TECH1 – Use Case Diagram opstellen',
              body: [
                '## Acceptatiecriteria',
                '- Alle actoren geïdentificeerd',
                '- Alle use cases uitgewerkt',
                '- Diagram toegevoegd aan documentatie'
              ].join('\n'),
            },

            {
              title: 'TECH2 – Activity Diagram orderproces',
              body: [
                '## Acceptatiecriteria',
                '- Orderproces gemodelleerd',
                '- Beslismomenten opgenomen',
                '- Diagram gevalideerd'
              ].join('\n'),
            },

            {
              title: 'TECH3 – Activity Diagram voorraadbeheer',
              body: [
                '## Acceptatiecriteria',
                '- Voorraadproces uitgewerkt',
                '- Tekortscenario opgenomen',
                '- Backorderproces opgenomen'
              ].join('\n'),
            },

            {
              title: 'TECH4 – Domeinmodel ontwerpen',
              body: [
                '## Acceptatiecriteria',
                '- Klant aanwezig',
                '- Order aanwezig',
                '- Product aanwezig',
                '- Leverancier aanwezig'
              ].join('\n'),
            },

            {
              title: 'TECH5 – ERD ontwerpen',
              body: [
                '## Acceptatiecriteria',
                '- Entiteiten gedefinieerd',
                '- Relaties gedefinieerd',
                '- Keys uitgewerkt'
              ].join('\n'),
            },

            {
              title: 'TECH6 – Databaseontwerp maken',
              body: [
                '## Acceptatiecriteria',
                '- Tabellen ontworpen',
                '- Relaties uitgewerkt',
                '- Normalisatie toegepast'
              ].join('\n'),
            },

            {
              title: 'TECH7 – Wireframes ontwerpen',
              body: [
                '## Acceptatiecriteria',
                '- Loginpagina',
                '- Dashboard',
                '- Orderscherm',
                '- Voorraadscherm'
              ].join('\n'),
            },

            {
              title: 'TECH8 – Softwarearchitectuur definiëren',
              body: [
                '## Acceptatiecriteria',
                '- Frontend beschreven',
                '- Backend beschreven',
                '- Database beschreven',
                '- Architectuurdiagram gemaakt'
              ].join('\n'),
            },

            {
              title: 'TECH9 – REST API specificatie opstellen',
              body: [
                '## Acceptatiecriteria',
                '- Endpoints beschreven',
                '- Requests beschreven',
                '- Responses beschreven'
              ].join('\n'),
            },

            {
              title: 'TECH10 – CI/CD Pipeline configureren',
              body: [
                '## Acceptatiecriteria',
                '- Build pipeline actief',
                '- PR validatie actief',
                '- Workflow succesvol uitvoerbaar'
              ].join('\n'),
            },

            {
              title: 'TECH11 – Testplan opstellen',
              body: [
                '## Acceptatiecriteria',
                '- Unit tests beschreven',
                '- Integratietests beschreven',
                '- Acceptatietests beschreven'
              ].join('\n'),
            },

            {
              title: 'TECH12 – Product Backlog onderhouden',
              body: [
                '## Acceptatiecriteria',
                '- Stories geprioriteerd',
                '- Story points toegevoegd',
                '- Sprintplanning mogelijk'
              ].join('\n'),
            },
            ];

            for (const issue of issues) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issue.title,
                body: issue.body,
                labels: ['user-story']
              });

              console.log(`Created issue: ${issue.title}`);
            }
