                '## Acceptatiecriteria',
                '- Openstaande orders zichtbaar',
                '- Backorders zichtbaar',
                '- Afgeleverde orders zichtbaar'
              ].join('\n'),
            },

            {
              title: 'US21 – Voorraad reserveren bij bestelling',
              body: [
                '**Als** verkoopmedewerker',
                '**wil ik** voorraad automatisch reserveren',
                '**zodat** producten niet dubbel verkocht kunnen worden.',
                '',
                '## Acceptatiecriteria',
                '- Voorraad reserveren',
                '- Gereserveerde voorraad zichtbaar',
                '- Dubbele verkoop voorkomen'
              ].join('\n'),
            },

            {
              title: 'US22 – Klant informeren over orderstatus',
              body: [
                '**Als** klant',
                '**wil ik** de actuele orderstatus kunnen bekijken',
                '**zodat** ik weet waar mijn bestelling zich bevindt.',
                '',
                '## Acceptatiecriteria',
                '- Status zichtbaar',
                '- Leverdatum zichtbaar',
                '- Backorderstatus zichtbaar'
              ].join('\n'),
            },

            {
              title: 'US23 – Verkooprapportages genereren',
              body: [
                '**Als** directie',
                '**wil ik** verkooprapportages kunnen bekijken',
