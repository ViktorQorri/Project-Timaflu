name: Create Timaflu User Story Issues

on:
  pull_request:
    types:
      - closed

jobs:
  create-issues:
    if: github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Create user story issues
        uses: actions/github-script@v7
        with:
          script: |
            const issues = [
              {
                title: 'US1 – Klanten beheren',
                body: [
                  '**Als** verkoopmedewerker',
                  '**wil ik** klantgegevens centraal beheren',
                  '**zodat** alle afdelingen dezelfde informatie gebruiken.',
                  '',
                  '## Acceptatiecriteria',
                  '- Klant aanmaken',
                  '- Klant wijzigen',
                  '- Klant verwijderen',
                  '- Leveradres registreren',
                  '- Factuuradres registreren',
                  '- Telefoonnummer registreren',
                  '- Jaaromzet registreren'
                ].join('\n'),
              },

              {
                title: 'US2 – Orders registreren',
                body: [
                  '**Als** verkoopmedewerker',
                  '**wil ik** telefonisch geplaatste orders digitaal registreren',
                  '**zodat** orders correct verwerkt worden.',
                  '',
                  '## Acceptatiecriteria',
                  '- Klant selecteren',
                  '- Product toevoegen',
                  '- Aantal invoeren',
                  '- Orderdatum opslaan',
                  '- Totaalprijs berekenen'
                ].join('\n'),
              },

              {
                title: 'US3 – Kortingen automatisch berekenen',
                body: [
                  '**Als** verkoopmedewerker',
                  '**wil ik** automatische kortingsberekeningen',
                  '**zodat** fouten worden voorkomen.',
                  '',
                  '## Acceptatiecriteria',
                  '- 5% korting vanaf €500',
                  '- Klantkorting automatisch toepassen',
                  '- Jaaromzet automatisch bepalen'
                ].join('\n'),
              },

              {
                title: 'US4 – Realtime voorraadbeheer',
                body: [
                  '**Als** verkoopmedewerker',
                  '**wil ik** actuele voorraad kunnen zien',
                  '**zodat** ik geen niet-beschikbare medicijnen verkoop.',
                  '',
                  '## Acceptatiecriteria',
                  '- Voorraad realtime zichtbaar',
                  '- Gereserveerde voorraad zichtbaar',
                  '- Niet beschikbare producten markeren'
                ].join('\n'),
              },

              {
                title: 'US5 – Orderstatus beheren',
                body: [
                  '**Als** medewerker',
                  '**wil ik** de status van orders volgen',
                  '**zodat** klanten geïnformeerd kunnen worden.',
                  '',
                  '## Acceptatiecriteria',
                  '- Nieuw',
                  '- Wordt verzameld',
                  '- Backorder',
                  '- Verpakt',
                  '- Verzonden',
                  '- Afgeleverd'
                ].join('\n'),
              },

              {
                title: 'US6 – Productcatalogus beheren',
                body: [
                  '**Als** inkoper',
                  '**wil ik** producten centraal beheren',
                  '**zodat** de catalogus actueel blijft.',
                  '',
                  '## Acceptatiecriteria',
                  '- Product toevoegen',
