# Start: reproduceerbare controle van Timaflu's HTML/CSS, mobiele processen en demo-data.
name: Timaflu frontendcriteria

on:
  pull_request:
    paths:
      - 'code/frontend/**'
      - 'code/backend/**'
      - 'code/database/**'
      - 'scripts/**'
      - 'Documentation/Architecture/test-data/**'
      - 'eer.mwb'
      - '.github/workflows/frontend-criteria.yml'
  workflow_dispatch:

jobs:
  frontend-criteria:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: TestTemporaryOnly94
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pTestTemporaryOnly94"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      TIMAFLU_TEST_ALLOW_RESET: isolated
      TIMAFLU_TEST_MYSQL_HOST: 127.0.0.1
      TIMAFLU_TEST_MYSQL_PORT: '3306'
      TIMAFLU_TEST_MYSQL_USER: root
      TIMAFLU_TEST_MYSQL_PASSWORD: TestTemporaryOnly94
      TIMAFLU_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Installeer backend en afzonderlijke browser-testtools
        run: |
          python -m pip install -r code/backend/requirements.txt
          python -m pip install playwright==1.56.0 markdown==3.11.2
          python -m playwright install --with-deps chromium
      - name: Controleer SQL, EER en inkoopqueries
        run: python scripts/oplevering/validate_eer_schema.py
      - name: Bouw fictieve MySQL-data en toets alle paginaqueries
        run: python scripts/oplevering/audit_ui_queries.py
      - name: Controleer 29 echte schermen op 4 breedtes
        run: python scripts/oplevering/verify_frontend_criteria.py
      - name: Controleer orderpicking, distributie, inkoop en acquisitie
        run: python scripts/oplevering/verify_frontend_workflows.py
      - name: Genereer volledig MySQL-querybewijs en schermontwerpen
        run: python scripts/oplevering/build_query_proof.py
      - name: Controleer opleverarchieven
        run: python scripts/build_deliverables.py --output-dir deliverables
# Einde: frontendcriteria zonder JavaScript in de website zelf.
