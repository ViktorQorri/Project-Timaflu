name: Timaflu casuscontrole MySQL en UML

on:
  pull_request:
  push:
    branches:
      - feature/five-required-backend-scenarios
  workflow_dispatch:

jobs:
  case-proof:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: TestTemporaryOnly94
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pTestTemporaryOnly94"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      TIMAFLU_TEST_ALLOW_RESET: isolated
      TIMAFLU_TEST_MYSQL_HOST: 127.0.0.1
      TIMAFLU_TEST_MYSQL_PORT: "3306"
      TIMAFLU_TEST_MYSQL_PASSWORD: TestTemporaryOnly94
      CASEPROOF_DB_PORT: "3306"
      CASEPROOF_DB_PASSWORD: TestTemporaryOnly94
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependencies
        run: python -m pip install -r code/backend/requirements.txt
      - name: Five independent rounds of unit and real MySQL integration tests
        working-directory: code/backend
        run: |
          for round in 1 2 3 4 5; do
            echo "FULL CASE REGRESSION ROUND $round OF 5"
            python -m unittest discover -p "test_*.py" -q
          done
      - name: Five concurrent robot integration test rounds
        run: |
          for round in 1 2 3 4 5; do
            echo "REAL MYSQL ROBOT ROUND $round OF 5"
            python Documentation/Architecture/test-data/run_robot_concurrency_mysql.py
          done
      - name: Five official backend case scenario and migration rounds
        run: |
          for round in 1 2 3 4 5; do
            echo "OFFICIAL CASE AND MIGRATIONS ROUND $round OF 5"
            python Documentation/Architecture/test-data/run_caseproof_mysql.py
            python Documentation/Architecture/test-data/run_caseproof_migrations.py
          done
      - name: Five case screen semantics and UML rounds
        run: |
          for round in 1 2 3 4 5; do
            echo "DESIGN AND UML ROUND $round OF 5"
            python Documentation/Architecture/screens/test_case_screens.py
            python -m unittest discover -s Documentation/Architecture/uml/tests -p "test_*.py"
          done
      - name: Query synchronization and class diagram
        run: |
          python code/database/generate_weekly_queries.py --check
          python code/database/generate_backend_uml.py --check
      - name: Reproduce query output for each working page
        run: python code/database/audit_ui_queries.py
      - name: Validate final EER against actual MySQL information_schema
        run: python code/database/generate_eer.py --database timaflu_casus_test_94 --check
      - name: Save reproducible MySQL evidence
        uses: actions/upload-artifact@v4
        with:
          name: timaflu-casus-mysql-evidence
          path: |
            Documentation/Architecture/query-output-per-screen.md
            Documentation/Architecture/eer-mysql-schema.json
            Documentation/Architecture/eer-mysql-verified.svg
            Documentation/Architecture/eer-mysql-verified.drawio
          retention-days: 14
