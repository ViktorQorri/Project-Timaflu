name: Controle online Timaflu-database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controle-online-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_HOST: ${{ secrets.TIMAFLU_DB_HOST }}
      DB_PORT: ${{ secrets.TIMAFLU_DB_PORT }}
      DB_NAME: ${{ secrets.TIMAFLU_DB_NAME }}
      DB_USER: ${{ secrets.TIMAFLU_DB_USER }}
      DB_PASSWORD: ${{ secrets.TIMAFLU_DB_PASSWORD }}
      DB_REQUIRE_TLS: "1"
      DB_SSL_CA: timaflu-mysql-ca.pem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installeer databaseconnector
        run: python -m pip install -r code/backend/requirements.txt
      - name: Controleer secrets en stel het CA-certificaat in
        shell: bash
        env:
          DB_SSL_CA_PEM: ${{ secrets.TIMAFLU_DB_SSL_CA_PEM }}
        run: |
          if [ -z "$DB_HOST" ] || [ -z "$DB_PORT" ] || [ -z "$DB_NAME" ] || [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ] || [ -z "$DB_SSL_CA_PEM" ]; then
            echo "::error::Stel eerst de zes TIMAFLU_DB_* repository-secrets in."
            exit 1
          fi
          printf '%s\n' "$DB_SSL_CA_PEM" > "$DB_SSL_CA"
          chmod 600 "$DB_SSL_CA"
      - name: Controleer online database zonder gegevens te wijzigen
        run: python code/database/verify_online_database.py --report-json deliverables/online-database-controle.json
      - name: Bewaar bewijs van de online controle
        uses: actions/upload-artifact@v4
        with:
          name: timaflu-online-database-bewijs
          path: deliverables/online-database-controle.json
          retention-days: 14
