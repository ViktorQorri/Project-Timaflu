{% extends "base.html" %}
{% block title %}Fout {{ status }}{% endblock %}
{% block content %}
  <section class="stock-dashboard error-page" aria-labelledby="error-title">
    <div class="panel">
      <p class="error-page__code">Fout {{ status }}</p>
      <h1 id="error-title">Deze actie is niet gelukt</h1>

    </div>
  </section>
{% endblock %}
