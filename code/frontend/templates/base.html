<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Timaflu{% endblock %} | Timaflu</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="{{ url_for('home.index') }}">Timaflu</a>
    <nav>
      <ul>
        <li><a href="{{ url_for('home.index') }}">Home</a></li>
      </ul>
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="flash flash-{{ category }}">{{ message }}</p>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">Timaflu information system</footer>
</body>
</html>
