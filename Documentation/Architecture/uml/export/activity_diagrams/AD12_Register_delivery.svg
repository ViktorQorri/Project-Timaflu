r</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="138" x="250" y="221.4932">and contact the customer</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="219" x="232" y="269.1299"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="199" x="242" y="291.5869">Execute AD27 Handle failed delivery:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="171" x="242" y="306.6807">plan second attempt later today</text><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="12.4551" y2="519.5049"/><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="102" x="461" y="183.9424"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="82" x="471" y="206.3994">Sign for receipt</text><line style="stroke:#000000;stroke-width:1.5;" x1="455" x2="455" y1="12.4551" y2="519.5049"/><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="225" x="573" y="324.1299"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="205" x="583" y="346.5869">Record confirmation of signed receipt</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="92" x="583" y="361.6807">and delivery time</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="203" x="584" y="409.3174"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="183" x="594" y="431.7744">Update order status if all required</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="131" x="594" y="446.8682">products were delivered</text><ellipse cx="685.5" cy="492