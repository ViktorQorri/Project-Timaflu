<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="530" fill="#ffffff"/>

  <rect x="320" y="25" width="300" height="480" rx="8" fill="#f7f7f7" stroke="#666" stroke-dasharray="6 4"/>
  <text x="470" y="46" text-anchor="middle" font-weight="bold">Python backend (Flask)</text>

  <rect x="40" y="55" width="200" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="140" y="82" text-anchor="middle" font-weight="bold">Browser</text>
  <text x="140" y="101" text-anchor="middle">HTML + CSS, no JS</text>
  <text x="140" y="117" text-anchor="middle" font-size="11">employees and couriers</text>

  <rect x="40" y="135" width="200" height="70" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  <text x="140" y="162" text-anchor="middle" font-weight="bold">Robot</text>
  <text x="140" y="181" text-anchor="middle">one per aisle</text>

  <rect x="340" y="60" width="260" height="60" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="470" y="85" text-anchor="middle" font-weight="bold">Page routes</text>
  <text x="470" y="103" text-anchor="middle" font-size="12">GET and POST, Jinja2 templates</text>

  <rect x="400" y="140" width="200" height="60" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="500" y="165" text-anchor="middle" font-weight="bold">JSON API routes</text>
  <text x="500" y="183" text-anchor="middle" font-size="12">for the robots</text>

  <rect x="340" y="250" width="260" height="60" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="470" y="275" text-anchor="middle" font-weight="bold">Services</text>
  <text x="470" y="293" text-anchor="middle" font-size="12">business logic, the 5 processes</text>

  <rect x="340" y="340" width="260" height="60" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="470" y="365" text-anchor="middle" font-weight="bold">Repositories</text>
  <text x="470" y="383" text-anchor="middle" font-size="12">the only place with SQL</text>

  <rect x="340" y="430" width="260" height="50" rx="6" fill="#ffffff" stroke="#82b366" stroke-dasharray="4 3"/>
  <text x="470" y="452" text-anchor="middle" font-weight="bold">Domain classes</text>
  <text x="470" y="469" text-anchor="middle" font-size="12">same names as class diagram and EER</text>

  <g>
    <path d="M700,342 L700,408 A80,14 0 0 0 860,408 L860,342" fill="#e1d5e7" stroke="#9673a6"/>
    <ellipse cx="780" cy="342" rx="80" ry="14" fill="#e1d5e7" stroke="#9673a6"/>
    <text x="780" y="376" text-anchor="middle" font-weight="bold">MySQL</text>
    <text x="780" y="394" text-anchor="middle" font-size="12">database, online</text>
  </g>

  <line x1="240" y1="90" x2="340" y2="90" stroke="#333" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="290" y="78" text-anchor="middle" font-size="11">request / HTML</text>

  <line x1="240" y1="170" x2="400" y2="170" stroke="#333" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="320" y="190" text-anchor="middle" font-size="11">HTTP + JSON</text>

  <line x1="360" y1="120" x2="360" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="200" x2="500" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="310" x2="470" y2="340" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="600" y1="370" x2="700" y2="370" stroke="#333" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="650" y="358" text-anchor="middle" font-size="11">SQL</text>
  <text x="650" y="386" text-anchor="middle" font-size="11">parameterized</text>
</svg>
